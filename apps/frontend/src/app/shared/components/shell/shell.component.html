<div class="ds-shell shell">
  @if (sidebarAberta()) {
    <button
      class="shell__overlay"
      type="button"
      aria-label="Fechar menu"
      (click)="fecharSidebar()"
    ></button>
  }
  <app-sidebar
    class="shell__sidebar"
    [class.shell__sidebar--visivel]="sidebarAberta()"
    [aberta]="sidebarAberta()"
    (navegar)="fecharSidebar()"
  />
  <div class="ds-shell__conteudo shell__conteudo">
    <app-header (alternarSidebar)="alternarSidebar()" />
    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
