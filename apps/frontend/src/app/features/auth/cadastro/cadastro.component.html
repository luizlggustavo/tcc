<div class="cadastro auth">
  <div class="ds-card auth__card">
    <div class="ds-card__corpo auth__corpo">
      <h1 class="ds-titulo-3 auth__titulo">Criar conta</h1>
      <p class="ds-texto ds-texto-centro">
        Cadastre seu acesso para começar a estudar
      </p>

      <form
        class="ds-stack auth__formulario"
        [formGroup]="formulario"
        (ngSubmit)="cadastrar()"
        novalidate
      >
        <label
          class="ds-campo"
          [class.ds-campo--erro]="
            formulario.get('nome')?.invalid && formulario.get('nome')?.touched
          "
          for="nome"
        >
          <span class="ds-campo__rotulo">Nome</span>
          <input
            class="ds-campo__controle"
            id="nome"
            type="text"
            formControlName="nome"
            autocomplete="name"
            placeholder="Seu nome"
          />
          @if (
            formulario.get('nome')?.invalid && formulario.get('nome')?.touched
          ) {
            <span class="ds-campo__erro" role="alert"> Informe seu nome. </span>
          }
        </label>

        <label
          class="ds-campo"
          [class.ds-campo--erro]="
            formulario.get('email')?.invalid && formulario.get('email')?.touched
          "
          for="email"
        >
          <span class="ds-campo__rotulo">E-mail</span>
          <input
            class="ds-campo__controle"
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="seu@email.com"
          />
          @if (
            formulario.get('email')?.invalid && formulario.get('email')?.touched
          ) {
            <span class="ds-campo__erro" role="alert">
              Informe um e-mail válido.
            </span>
          }
        </label>

        <label
          class="ds-campo"
          [class.ds-campo--erro]="
            formulario.get('senha')?.invalid && formulario.get('senha')?.touched
          "
          for="senha"
        >
          <span class="ds-campo__rotulo">Senha</span>
          <input
            class="ds-campo__controle"
            id="senha"
            type="password"
            formControlName="senha"
            autocomplete="new-password"
            placeholder="Mínimo de 8 caracteres"
          />
          @if (
            formulario.get('senha')?.invalid && formulario.get('senha')?.touched
          ) {
            <span class="ds-campo__erro" role="alert">
              A senha precisa ter no mínimo 8 caracteres.
            </span>
          }
        </label>

        @if (erro()) {
          <div class="ds-alerta ds-alerta--erro" role="alert">
            {{ erro() }}
          </div>
        }

        <button
          class="ds-botao ds-botao--primario"
          type="submit"
          [disabled]="carregando()"
        >
          {{ carregando() ? 'Criando conta...' : 'Criar conta' }}
        </button>
      </form>

      <p class="auth__acao-secundaria">
        Já tem acesso?
        <a class="ds-link" routerLink="/login">Entrar</a>
      </p>
    </div>
  </div>
</div>
